<div class="grid">
    <div class="col-12 md:col-6">
        <div class="card p-fluid">
            <h5>Account Information</h5>
            <div class="p-formgrid grid">
                <!-- Account Name Field -->
                <div class="field col-12">
                    <label for="account_name">Account Name</label>
                    <input pInputText id="account_name" formControlName="account_name" placeholder="Enter account name" />
                </div>

                <!-- Username Field -->
                <div class="field col-12">
                    <label for="username">Username</label>
                    <input pInputText id="username" formControlName="username" placeholder="Enter username" />
                </div>

                <!-- Password Field -->
                <div class="field col-12">
                    <label for="password">Password</label>
                    <input pInputText id="password" type="password" formControlName="password" placeholder="Enter password" />
                </div>

                <!-- URL Field -->
                <div class="field col-12">
                    <label for="url">URL</label>
                    <input pInputText id="url" formControlName="url" placeholder="Enter account URL" />
                </div>

                <!-- Is Bill Checkbox -->
                <div class="field-checkbox col-12">
                    <p-checkbox
                            id="is_bill"
                            formControlName="is_bill"
                            label="Is Bill">
                    </p-checkbox>
                    <label for="is_bill" class="ml-2">Is Bill</label>
                </div>

                <!-- Submit Button -->
                <div class="field col-12">
                    <button pButton type="submit" label="Save Account" class="p-button-primary" (click)="onSubmit()"></button>
                </div>
            </div>
        </div>
    </div>
</div>
